services:
  glowup-ai:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: glowup-ai
    ports:
      - "8080:3000"
    environment:
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY}
      ELEVENLABS_VOICE_ID: ${ELEVENLABS_VOICE_ID:-Xb7hH8MSUJpSbSDYk0k2}
      ELEVENLABS_MODEL_ID: ${ELEVENLABS_MODEL_ID:-eleven_flash_v2_5}
      ELEVENLABS_VOICE_ALEX: ${ELEVENLABS_VOICE_ALEX:-}
      ELEVENLABS_VOICE_MIRA: ${ELEVENLABS_VOICE_MIRA:-}
      ELEVENLABS_VOICE_LUMI: ${ELEVENLABS_VOICE_LUMI:-}
      ELEVENLABS_VOICE_LEO: ${ELEVENLABS_VOICE_LEO:-}
      ELEVENLABS_VOICE_NOVA: ${ELEVENLABS_VOICE_NOVA:-}
    restart: unless-stopped
